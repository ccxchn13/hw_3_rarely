<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in | AttendanceChimp</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 3rem; }
    form { display: inline-block; text-align: left; }
    p { margin: 0.6rem 0; }
  </style>
</head>
<body>
  <h1>Log in to AttendanceChimp</h1>
  {% if form.errors %}
    <p>Your user name and password didn't match. Please try again.</p>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <p><label>User name: <input type="text" name="username" required autofocus></label></p>
    <p><label>Password: <input type="password" name="password" required></label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <p><input type="submit" value="Log in"></p>
  </form>
</body>
</html>
