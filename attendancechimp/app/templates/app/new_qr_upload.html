<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload QR code | AttendanceChimp</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 3rem; }
    form { display: inline-block; text-align: left; }
    p { margin: 0.6rem 0; }
  </style>
</head>
<body>
  <h1>Upload a photo of the QR code</h1>
  <form method="post" action="/app/createQRCodeUpload" enctype="multipart/form-data">
    {% csrf_token %}
    <p><label>Photo: <input type="file" name="imageUpload" accept="image/*" required></label></p>
    <p><input type="submit" value="Upload"></p>
  </form>
  <p><a href="/app/">Back to the home page</a></p>
</body>
</html>
